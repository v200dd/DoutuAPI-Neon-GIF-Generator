version: '3.8'

services:
  gif-generator:
    container_name: gifapi
    build: .
    ports:
      - "8000:8000"
    volumes:
      # 将当前目录挂载进去，方便热更新代码 (修改代码无需重建镜像)
      - ./:/app
      # 如果你有字体文件夹，确保它存在，否则可以注释掉下面这行
      - ./fonts:/app/fonts
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # 开启开发模式的热重载命令
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload