name: Docker integration
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOUTU_PUBLIC_URL: http://127.0.0.1:8000
      DOUTU_BIND_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create disposable test-only admin password
        run: printf 'ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Install test dependencies
        run: pip install -r neon/requirements.txt pytest httpx
      - name: Unit and regression tests
        run: pytest -q tests/test_neon.py
      - name: Build and start full Compose stack
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: PHP syntax check
        run: docker compose exec -T doutu sh -c 'find /var/www/html -name "*.php" -exec php -l {} \;'
      - name: End-to-end PNG, GIF, authorization and routes
        run: python tests/smoke.py http://127.0.0.1:8000
      - name: Authorization survives container restart
        run: |
          curl -fsS -X POST -H "X-API-Key: $ADMIN_PASSWORD" -d 'wxid=persistence-check' 'http://127.0.0.1:8000/admin.php?action=api_add'
          docker compose restart doutu
          docker compose up -d --wait --wait-timeout 90
          python -c "import urllib.request,json; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/?keyword=test&wxid=persistence-check')); assert r['code']==200 and len(r['items'])==28; print('PASS persistent authorization after restart')"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up disposable containers
        if: always()
        run: docker compose down -v
