events {}
http {
    limit_req_zone $binary_remote_addr zone=gif:10m rate=1r/s;
    server {
        listen 80;
        client_max_body_size 64k;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz {
            proxy_pass http://gif-generator:8000/healthz;
        }
        location = /generate {
            limit_req zone=gif burst=3 nodelay;
            limit_req_status 429;
            proxy_read_timeout 60s;
            proxy_pass http://gif-generator:8000;
        }
        location = /neon { return 301 /neon/; }
        location = /neon/ { proxy_pass http://gif-generator:8000/; }
        location /neon/static/ {
            proxy_pass http://gif-generator:8000/static/;
        }
        location = /docs { proxy_pass http://gif-generator:8000/docs; }
        location = /openapi.json { proxy_pass http://gif-generator:8000/openapi.json; }
        location ~ /\. { return 404; }
        location = /config.php { return 404; }
        location ~* \.(json|ini|env|ya?ml|sh|py|md|txt|zip|patch)$ { return 404; }
        location / {
            proxy_set_header Host $host;
            proxy_pass http://doutu;
        }
    }
}
